services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis

  worker:
    build: .
    command: celery -A api.celery_app worker --loglevel=info --concurrency=2
    volumes:
      - .:/app
    env_file: .env
    depends_on:
      - redis
